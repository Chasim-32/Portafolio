<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Biblioteca</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../../css/styles.css">
</head>

<body>

    <div class="container py-5">

        <!-- Título -->
        <div class="text-center mb-5">
            <h1>Sistema de Biblioteca</h1>

            <p class="lead">
                Procesamiento de solicitudes para préstamo de libros
            </p>
        </div>


        
        <div class="card shadow p-4 mx-auto biblioteca-card">

            <h3 class="mb-4">Solicitud de préstamo</h3>

            <div class="mb-3">
                <label for="nombreUsuario" class="form-label">
                    Nombre del usuario
                </label>

                <input
                    type="text"
                    id="nombreUsuario"
                    class="form-control"
                    placeholder="Ej: José Manuel"
                >
            </div>


            <div class="mb-3">
                <label for="libros" class="form-label">
                    Títulos de los libros
                </label>

                <textarea
                    id="libros"
                    class="form-control"
                    rows="5"
                    placeholder="Escribe un libro por línea"
                ></textarea>
            </div>


            <button
                id="procesarBtn"
                class="btn btn-primary"
            >
                Procesar solicitud
            </button>


            
            <div id="resultado" class="mt-4"></div>

        </div>


        


        <div class="text-center mt-5">
            <a href="../../index.html" class="btn btn-secondary">
                Volver al portafolio
            </a>
        </div>

    </div>


    <script src="biblioteca.js"></script>

</body>
</html>
